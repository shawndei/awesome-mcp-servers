name: Fix Glimind entry link
on:
  push:
    paths:
      - '.github/workflows/fix-glimind-entry.yml'
permissions:
  contents: write
jobs:
  fix-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace glimind.com link with GitHub repo link
        run: |
          python3 <<'PYEOF'
          import subprocess
          subprocess.run(['git', 'checkout', 'add-glimind'], check=True)
          p = 'README.md'
          with open(p, encoding='utf-8') as f:
              lines = f.read().split('\n')
          old = '[Glimind](https://glimind.com)'
          new = '[Glimind](https://github.com/glimind/mcp)'
          hits = [i for i, l in enumerate(lines) if old in l and l.startswith('- [Glimind]')]
          if not hits:
              print('Entry already uses GitHub link or missing; nothing to do')
              raise SystemExit(0)
          assert len(hits) == 1, 'expected exactly one Glimind entry line'
          lines[hits[0]] = lines[hits[0]].replace(old, new)
          with open(p, 'w', encoding='utf-8') as f:
              f.write('\n'.join(lines))
          subprocess.run(['git', 'config', 'user.name', 'shawndei'], check=True)
          subprocess.run(['git', 'config', 'user.email', 'shawndei@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', 'README.md'], check=True)
          subprocess.run(['git', 'commit', '-m', 'Use GitHub repo link for Glimind entry'], check=True)
          subprocess.run(['git', 'push', 'origin', 'add-glimind'], check=True)
          print('Fixed entry and pushed to add-glimind')
          PYEOF
